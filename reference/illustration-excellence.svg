<svg viewBox="0 0 360 300" xmlns="http://www.w3.org/2000/svg" fill="none" role="img" aria-label="Excellence">
  <!-- main strokes use currentColor (set color in CSS: light on dark hero) -->
  <g stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- outer medal -->
    <circle pathLength="1" data-draw-delay="0s" cx="180" cy="120" r="60"/>
    <!-- ribbon tails -->
    <path pathLength="1" data-draw-delay="0.35s" d="M150 176 L136 244 L168 218"/>
    <path pathLength="1" data-draw-delay="0.45s" d="M210 176 L224 244 L192 218"/>
  </g>
  <!-- accents in sauge -->
  <g stroke="#9EA596" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- inner ring -->
    <circle pathLength="1" data-draw-delay="0.6s" cx="180" cy="120" r="46"/>
    <!-- star -->
    <path pathLength="1" data-draw-delay="1s" d="M180 92 L186.7 110.9 L206.9 111.7 L191.1 124.2 L196.9 143.6 L180 132.4 L163.1 143.6 L168.9 124.2 L153.1 111.7 L173.3 110.9 Z"/>
  </g>
</svg>
